<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        // ENVELOPE ADDRESSES (use <br> for line breaks)
        const SENDER_ADDRESS = `Onigiri Productions<br>
                                270526 GitHub St.<br>
                                Internet, Earth 00000`;

        const RECIPIENT_ADDRESS = `Valued Recipient<br>
                                   127.0.0.1 Local Host Way<br>
                                   Cyberspace, Earth 11111`;

        // PAGE DATA (Add, remove, or modify objects to change pages)
        const PAGES_DATA = [
            {
                // First page
                type: "cover",
                date: "XX Month 20XX",
                title: "Card Title",
                content: "Replace this text with your custom message..."
            },
            {
                // Additional page
                type: "standard",
                title: "Additional Page",
                content: "Add more content here such as images, quotes, event details..."
            },
            {
                // final page
                type: "onigiri-productions",
                title: "Brought to you by...",
                content: "ONIGIRI PRODUCTIONS 🍙",
                link: "https://github.com/goldberl/ecard"
            }
        ];
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onigiri Productions HTML E-Card Template With Wacky CSS</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍙</text></svg>">

    <style>
        /* =========================
        GLOBAL SIZE CONTROLS
        ========================= */

        :root {
            --scale: 0.80;

            /* layout */
            --envelope-width: calc(700px * var(--scale));
            --envelope-height: calc(350px * var(--scale));
            --page-width: calc(700px * var(--scale));

            --border-thickness: calc(8px * var(--scale));
            --padding: calc(30px * var(--scale));

            /* typography */
            --font-small: calc(14px * var(--scale));
            --font-body: calc(16px * var(--scale));
            --font-heading: calc(22px * var(--scale));
            --font-title: calc(26px * var(--scale));

            --stamp-size: calc(60px * var(--scale));

            /* buttons */
            --btn-padding-y: calc(10px * var(--scale));
            --btn-padding-x: calc(22px * var(--scale));
            --btn-gap: calc(12px * var(--scale));

            /* positioning */
            --letter-top: calc(420px * var(--scale));
            --lift-letter: calc(-350px * var(--scale));
            --lift-page: calc(-250px * var(--scale));
        }

        /* =========================
        BASE
        ========================= */

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #fff9ed;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            overflow-x: hidden;
            overflow-y: clip;

            padding-top: calc(100px * var(--scale));
        }

        #app {
            width: 100%;
            text-align: center;
            position: relative;
        }

        /* =========================
        ENVELOPE
        ========================= */

        #envelope-container {
            position: relative;
        }

        #envelope {
            position: relative;
            width: var(--envelope-width);
            height: var(--envelope-height);

            background-color: #f5d7a1;
            border: var(--border-thickness) solid #444;
            border-radius: 5px;

            display: inline-block;
            transition: transform 1.2s ease, box-shadow 0.3s ease;
            cursor: pointer;
            overflow: hidden;
            z-index: 2;

            transform-origin: center;
        }

        #envelope:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        #envelope.open {
            transform: rotateY(180deg);
        }

        #envelope.open:hover {
            transform: rotateY(180deg) scale(1.05);
        }

        #sender {
            position: absolute;
            top: calc(20px * var(--scale));
            left: calc(20px * var(--scale));
            font-size: var(--font-body);
            color: #333;
            transition: opacity 0.5s ease;
            text-align: left;
        }

        #recipient {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: var(--font-heading);
            color: #333;
            transition: opacity 0.5s ease;
            text-align: left;
        }

        #stamp {
            position: absolute;
            top: calc(20px * var(--scale));
            right: calc(20px * var(--scale));
            font-size: var(--stamp-size);
        }

        .hide-text {
            opacity: 0;
        }

        /* =========================
        BUTTONS
        ========================= */

        .content-buttons {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: var(--btn-gap);
            margin-top: calc(20px * var(--scale));
        }

        .fixed-buttons {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            gap: var(--btn-gap);
        }

        button {
            padding: var(--btn-padding-y) var(--btn-padding-x);
            border: none;
            border-radius: 6px;
            background: #555;
            color: white;
            cursor: pointer;
            font-size: var(--font-body);
        }

        button:hover {
            background: #f14848;
        }

        /* =========================
        PAGES
        ========================= */

        .card-page {
            display: none;
            position: absolute;

            left: 50%;
            top: var(--letter-top);

            transform: translateX(-50%);
            width: var(--page-width);

            background: white;
            border: var(--border-thickness) solid #444;
            padding: var(--padding);
            box-sizing: border-box;

            opacity: 0;
            transition: transform 1.2s ease, opacity 1.2s ease;

            flex-direction: column;
            min-height: calc(400px * var(--scale));
        }

        .card-page[data-index="0"] {
            z-index: 3;
        }

        .card-page:not([data-index="0"]) {
            z-index: 4;
            text-align: left;
        }

        .card-page:not(.open) {
            pointer-events: none;
        }

        .card-page.open {
            pointer-events: auto;
            opacity: 1;
        }

        .card-page[data-index="0"].open {
            transform: translateX(-50%) translateY(var(--lift-letter));
        }

        .card-page:not([data-index="0"]).open {
            transform: translateX(-50%) translateY(var(--lift-page));
        }

        /* =========================
        ONIGIRI PRODUCTIONS STYLES
        ========================= */

        .card-page.onigiri-productions-page {
            text-align: center !important;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            border-color: #222;
            font-family: 'Courier New', Courier, monospace;
        }

        .card-page.onigiri-productions-page h2 {
            font-size: var(--font-body);
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 5px;
            font-weight: bolder;
        }

        .card-page.onigiri-productions-page .production-logo {
            font-size: calc(30px * var(--scale));
            color: #000000;
            font-weight: bolder;
            letter-spacing: 4px;
            margin: 15px 0 5px 0;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.35);
        }

        .card-page.onigiri-productions-page .production-link {
            font-size: var(--font-small);
            margin-bottom: 25px;
        }

        .card-page.onigiri-productions-page .production-link a {
            color: #f0224b;
            text-decoration: none;
            font-weight: bolder;
        }

        .card-page.onigiri-productions-page .production-link a:hover {
            text-decoration: underline;
        }

        .card-page.onigiri-productions-page .production-copyright {
            font-size: var(--font-body);
            color: #000000;
            letter-spacing: 1px;
            font-weight: bolder;
        }


        /* =========================
        TEXT
        ========================= */

        h1 {
            font-size: var(--font-title);
            color: #222;
        }

        h2 {
            font-size: var(--font-heading);
            color: #222;
        }

        p {
            font-size: var(--font-body);
            color: #222;
        }

        .text-left {
            text-align: left;
        }

        .text-right {
            text-align: right;
        }

        .btn-container {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>

<body>

    <div id="app">

        <div id="envelope-container">

            <div id="envelope" onclick="openEnvelope()">
                <div id="sender"></div>
                <div id="stamp">📬</div>
                <div id="recipient"></div>
            </div>

            <div id="pages-placeholder"></div>

        </div>

    </div>

    <script>
        const NUM_PAGES = PAGES_DATA.length;
        let currentPageIndex = 0;

        function initApp() {
            // Inject envelope details
            document.getElementById("sender").innerHTML = SENDER_ADDRESS;
            document.getElementById("recipient").innerHTML = RECIPIENT_ADDRESS;

            // Build out the dynamic pages
            const container = document.getElementById("pages-placeholder");
            container.innerHTML = "";

            PAGES_DATA.forEach((page, index) => {
                const pageDiv = document.createElement("div");
                pageDiv.className = "card-page";
                pageDiv.id = `page-${index}`;
                pageDiv.setAttribute("data-index", index);

                // Check for the renamed page type identifier
                if (page.type === "onigiri-productions") {
                    pageDiv.classList.add("onigiri-productions-page");
                }

                let innerHTML = "";
                if (page.type === "cover") {
                    innerHTML += `<p class="text-right">${page.date || ""}</p>`;
                    innerHTML += `<h1 class="text-left">${page.title}</h1>`;
                    innerHTML += `<p class="text-left">${page.content}</p>`;
                } else if (page.type === "onigiri-productions") {
                    // Custom layout construction for the new text lines
                    const currentYear = new Date().getFullYear();
                    innerHTML += `<h2>${page.title}</h2>`;
                    innerHTML += `<div class="production-logo">${page.content}</div>`;
                    if (page.link) {
                        innerHTML += `<div class="production-link"><a href="${page.link}" target="_blank">${page.link}</a></div>`;
                    }
                    innerHTML += `<div class="production-copyright">&copy; ${currentYear}</div>`;
                } else {
                    innerHTML += `<h2>${page.title}</h2>`;
                    innerHTML += `<p>${page.content}</p>`;
                }

                innerHTML += `<div class="fixed-buttons">`;
                if (index > 0) {
                    innerHTML += `<button onclick="backPage()">Back</button>`;
                }
                if (index < NUM_PAGES - 1) {
                    innerHTML += `<button onclick="nextPage()">Next</button>`;
                }
                if (index === NUM_PAGES - 1) {
                    innerHTML += `<button onclick="closeEnvelope()">Close</button>`;
                }
                innerHTML += `</div>`;

                pageDiv.innerHTML = innerHTML;
                container.appendChild(pageDiv);
            });
        }

        function openEnvelope() {
            document.getElementById("envelope").classList.add("open");

            currentPageIndex = 0;
            const firstPage = document.getElementById(`page-${currentPageIndex}`);
            if (!firstPage) return;

            firstPage.style.display = "flex";

            setTimeout(() => {
                firstPage.classList.add("open");
            }, 200);
        }

        function nextPage() {
            if (currentPageIndex >= NUM_PAGES - 1) return;

            currentPageIndex++;
            const nextPageEl = document.getElementById(`page-${currentPageIndex}`);
            nextPageEl.style.display = "flex";

            setTimeout(() => nextPageEl.classList.add("open"), 200);
        }

        function backPage() {
            if (currentPageIndex <= 0) return;

            const activePageEl = document.getElementById(`page-${currentPageIndex}`);
            activePageEl.classList.remove("open");

            setTimeout(() => {
                activePageEl.style.display = "none";
            }, 800);

            currentPageIndex--;
        }

        function closeEnvelope() {
            document.getElementById("envelope").classList.remove("open");

            for (let i = 0; i < NUM_PAGES; i++) {
                const pageEl = document.getElementById(`page-${i}`);
                if (pageEl) {
                    pageEl.classList.remove("open");
                    setTimeout(() => {
                        pageEl.style.display = "none";
                    }, 800);
                }
            }
            currentPageIndex = 0;
        }

        // Fire everything up on launch
        initApp();
    </script>

</body>

</html>
