<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        // ENVELOPE ADDRESSES (use <br> for line breaks)
        const SENDER_ADDRESS = `Onigiri Productions<br>
                                270526 GitHub St.<br>
                                Internet, Earth 00000`;

        const RECIPIENT_ADDRESS = `Valued Recipient<br>
                                   127.0.0.1 Local Host Way<br>
                                   Cyberspace, Earth 11111`;

        // PAGE DATA (Add, remove, or modify objects to change pages)

        const PAGE_1_CONTENT = `
Welcome to your Onigiri HTML E-Card template with wacky CSS! This template
is designed to be lightweight and simple to use.

<br><br>

Simply edit the text here to write your message. Use < br >< br > (without 
the spaces) to start a new paragraph. If the spacing gets wacky, oh well...

<br><br>

If you add a new PAGE_N_CONTENT const here, don't forget to add it to PAGE_DATA 
below so that it renders. 

<br><br>

In the PAGE_DATA, you can also change the date, recipient, and signoff name below.

`

        const PAGE_2_CONTENT = `
You can change the line spacing if you go down to p {...} and adjust line-height.

<br><br>

Use the --scale variable to adjust the size of everything on the screen.

<br><br>

Other stuff can also be customized but I was too lazy to vibe code
that, so you will have to hunt through the code if you want to 
customize some things.

<br><br>

Also unfortunately no pictures can be added... just text and emojis 🐈✨🧡 for now.

<br><br>

Happy writing!

`
        const PAGES_DATA = [
            {
                // Front cover
                type: "cover",
                title: "Onigiri E-Card <br><span class=\"cover-emoji\">🍙</span><br>A wacky template",
            },
            {
                // Inside page
                type: "standard",
                date: "XX Month 20XX",
                to: "Dear Onigiri,",
                content: PAGE_1_CONTENT,
            },
            {
                // Inside page
                type: "standard",
                content: PAGE_2_CONTENT,
                signoff: "Love, <br> goldberl"
            },
            {
                // Back cover
                type: "onigiri-productions",
                title: "Brought to you by",
                content: "ONIGIRI PRODUCTIONS<br><span class=\"back-emoji\">🍙</span>",
                link: "https://github.com/goldberl/onigiri-ecard"
            }
        ];
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onigiri Productions HTML E-Card Template With Wacky CSS</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍙</text></svg>">

    <style>
        /* =======================================
        GLOBAL SIZE CONTROLLER (Your scale variable)
        ======================================= */
        :root {
            /* Change this value to scale the whole system up or down */
            --scale: 0.80;

            /* layout math mapped directly to scale */
            --envelope-width: calc(750px * var(--scale));
            --envelope-height: calc(380px * var(--scale));

            --page-width: calc(440px * var(--scale));
            --page-height: calc(560px * var(--scale));

            --border-thickness: calc(8px * var(--scale));
            --padding: calc(35px * var(--scale));

            /* typography scaling */
            --font-small: calc(14px * var(--scale));
            --font-body: calc(18px * var(--scale));
            --font-heading: calc(24px * var(--scale));
            --font-title: calc(32px * var(--scale));

            --stamp-size: calc(65px * var(--scale));
        }

        /* =========================
        BASE LAYOUT BLOCK
        ========================= */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #edf6ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #app {
            position: relative;
            width: var(--envelope-width);
            height: var(--page-height);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================
        ENVELOPE BACKGROUND
        ========================= */
        #envelope {
            position: absolute;
            width: var(--envelope-width);
            height: var(--envelope-height);
            background-color: #f5d7a1;
            border: var(--border-thickness) solid #444;
            border-radius: 5px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease, opacity 0.5s;
            cursor: pointer;
            overflow: hidden;
            z-index: 2;
        }

        #envelope:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        /* Dims back slightly but keeps its exact spot */
        #envelope.open {
            opacity: 0.75;
            pointer-events: none;
        }

        #sender {
            position: absolute;
            top: calc(20px * var(--scale));
            left: calc(20px * var(--scale));
            font-size: var(--font-body);
            font-weight: bold;
            color: #333;
            text-align: left;
        }

        #recipient {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: var(--font-heading);
            font-weight: bold;
            color: #333;
            text-align: left;
        }

        #stamp {
            position: absolute;
            top: calc(20px * var(--scale));
            right: calc(20px * var(--scale));
            font-size: var(--stamp-size);
        }

        /* =========================
        3D CARD OVERLAY (Slides Up)
        ========================= */
        .book {
            position: absolute;
            width: calc(var(--page-width) * 2);
            height: var(--page-height);
            perspective: 2000px;
            z-index: 10;

            /* Hidden resting position: lowered slightly and invisible */
            opacity: 0;
            transform: translateY(50px);
            pointer-events: none;

            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.15), opacity 0.5s ease;
        }

        /* Active position: slides up into alignment and becomes visible */
        .book.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .cover-page .cover-emoji {
            display: inline-block;
            font-size: calc(200px * var(--scale));
            margin: calc(5px * var(--scale));
        }

        /* Individual physical sheet structure */
        .page-leaf {
            position: absolute;
            width: var(--page-width);
            height: var(--page-height);
            top: 0;
            right: 0;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 1s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .page-leaf.flipped {
            transform: rotateY(-180deg);
        }

        /* Center Book Gutter Shadow */
        .book::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            width: 5px;
            height: 100%;
            background: rgba(0, 0, 0, 0.08);
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.15);
            z-index: 100;
            pointer-events: none;
        }

        /* Page Front & Back Base Styles */
        .page-front,
        .page-back {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: white;
            border: var(--border-thickness) solid #444;
            padding: var(--padding);
            box-sizing: border-box;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            cursor: pointer;
        }

        .page-back {
            transform: rotateY(180deg);
        }

        /* Makes the back cover logo emoji bigger and gives it some spacing */
        .onigiri-productions-page .back-emoji {
            display: inline-block;
            font-size: calc(55px * var(--scale));
            margin-top: calc(10px * var(--scale));
            margin-bottom: calc(10px * var(--scale));
        }

        /* =======================================
        PAGE CORNER HINT EFFECT (Hover Peeking)
        ======================================= */
        .page-front::after,
        .page-back::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            transition: width 0.3s ease, height 0.3s ease;
            pointer-events: none;
            z-index: 10;
        }

        .page-front::after {
            right: 0;
            background: linear-gradient(135deg, transparent 50%, rgba(0, 0, 0, 0.05) 50%, rgba(0, 0, 0, 0.15) 100%);
        }

        .page-back::after {
            left: 0;
            background: linear-gradient(225deg, transparent 50%, rgba(0, 0, 0, 0.05) 50%, rgba(0, 0, 0, 0.15) 100%);
        }

        .page-leaf.next-turn-target:not(.flipped) .page-front:hover::after {
            width: calc(35px * var(--scale));
            height: calc(35px * var(--scale));
            box-shadow: -3px -3px 8px rgba(0, 0, 0, 0.1);
            background: linear-gradient(135deg, transparent 45%, #eee 50%, #ccc 100%);
            border-bottom-left-radius: 4px;
        }

        .page-leaf.back-turn-target.flipped .page-back:hover::after {
            width: calc(35px * var(--scale));
            height: calc(35px * var(--scale));
            box-shadow: 3px -3px 8px rgba(0, 0, 0, 0.1);
            background: linear-gradient(225deg, transparent 45%, #eee 50%, #ccc 100%);
            border-bottom-right-radius: 4px;
        }

        /* =========================
        ONIGIRI PRODUCTIONS STYLES
        ========================= */
        .onigiri-productions-page {
            text-align: center !important;
            justify-content: center;
            align-items: center;
            background: #ffffff !important;
            border-color: #222 !important;
            font-family: 'Helvetica', monospace;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            margin: calc(var(--padding) * -1);
            padding: var(--padding);
        }

        .onigiri-productions-page h2 {
            font-size: var(--font-body);
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 5px;
            font-weight: bolder;
            margin-top: 0;
        }

        .onigiri-productions-page .production-logo {
            font-size: calc(30px * var(--scale));
            color: #000000;
            font-weight: bolder;
            letter-spacing: 4px;
            margin: 15px 0 5px 0;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.35);
        }

        .onigiri-productions-page .production-link {
            font-size: var(--font-small);
            margin-bottom: 25px;
        }

        .onigiri-productions-page .production-link a {
            color: #cb0029;
            text-decoration: none;
            font-weight: bolder;
        }

        .onigiri-productions-page .production-link a:hover {
            text-decoration: underline;
        }

        .onigiri-productions-page .production-copyright {
            font-size: var(--font-body);
            color: #000000;
            letter-spacing: 1px;
            font-weight: bolder;
        }

        /* =========================
        TEXT ELEMENTS
        ========================= */
        .cover-page {
            text-align: center;
            justify-content: center;
            align-items: center;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-size: var(--font-title);
            color: #222;
            margin: 0;
        }

        h2 {
            font-size: var(--font-heading);
            color: #222;
            margin-top: 0;
        }

        p {
            font-size: var(--font-body);
            color: #222;
            line-height: 1.3;
            font-weight: bold;
        }

        .text-left {
            text-align: left;
        }

        .text-right {
            text-align: right;
        }
    </style>
</head>

<body>

    <div id="app">

        <div id="envelope" onclick="openEnvelope(event)">
            <div id="sender"></div>
            <div id="stamp">🍙</div>
            <div id="recipient"></div>
        </div>

        <div id="book" class="book">
            <div id="leaves-container"></div>
        </div>

    </div>

    <script>
        let leafCount = 0;
        let currentLeafIndex = 0;
        let isBookOpen = false;

        function initApp() {
            document.getElementById("sender").innerHTML = SENDER_ADDRESS;
            document.getElementById("recipient").innerHTML = RECIPIENT_ADDRESS;

            const container = document.getElementById("leaves-container");
            container.innerHTML = "";

            const prodPageData = PAGES_DATA.find(p => p.type === 'onigiri-productions');
            const contentPages = PAGES_DATA.filter(p => p.type !== 'onigiri-productions');

            let leafDataPairs = [];

            // Shift content to the inside-right if there is exactly 1 standard text page
            if (contentPages.length === 2 && contentPages[1].type === "standard") {
                leafDataPairs.push({ front: contentPages[0], back: null }); // Cover on leaf 0 front, inside-left is blank
                leafDataPairs.push({ front: contentPages[1], back: null }); // Message shifts to leaf 1 front (inside-right position)
            } else {
                // Default handling for cards with multiple pages
                leafDataPairs.push({ front: contentPages[0], back: contentPages[1] || null });
                for (let i = 2; i < contentPages.length; i += 2) {
                    leafDataPairs.push({
                        front: contentPages[i] || null,
                        back: contentPages[i + 1] || null
                    });
                }
            }

            let lastPair = leafDataPairs[leafDataPairs.length - 1];
            if (lastPair.back !== null) {
                leafDataPairs.push({ front: null, back: prodPageData });
            } else {
                lastPair.back = prodPageData;
            }

            leafCount = leafDataPairs.length;

            leafDataPairs.forEach((pair, index) => {
                const leafDiv = document.createElement("div");
                leafDiv.className = "page-leaf";
                leafDiv.id = `leaf-${index}`;
                leafDiv.style.zIndex = leafCount - index;

                let frontHTML = `<div class="page-front" onclick="handlePageClick(event, ${index}, 'front')">`;
                if (pair.front) frontHTML += renderPageContent(pair.front);
                frontHTML += `</div>`;

                let backHTML = `<div class="page-back" onclick="handlePageClick(event, ${index}, 'back')">`;
                if (pair.back) backHTML += renderPageContent(pair.back);
                backHTML += `</div>`;

                leafDiv.innerHTML = frontHTML + backHTML;
                container.appendChild(leafDiv);
            });

            updateHoverTargets();
        }
        function renderPageContent(page) {
            if (page.type === "cover") {
                return `<div class="cover-page">
                    <h1>${page.title}</h1>
                </div>`;
            } else if (page.type === "onigiri-productions") {
                const currentYear = new Date().getFullYear();
                let html = `<div class="onigiri-productions-page">
                    <h2>${page.title}</h2>
                    <div class="production-logo">${page.content}</div>`;
                if (page.link) {
                    html += `<div class="production-link"><a href="${page.link}" target="_blank" onclick="event.stopPropagation();">${page.link}</a></div>`;
                }
                html += `<div class="production-copyright">&copy; ${currentYear}</div></div>`;
                return html;
            } else {
                let html = "";
                if (page.date) {
                    html += `<p class="text-right" style="margin-top: 0; margin-bottom: 5px;">${page.date}</p>`;
                }

                if (page.to) {
                    html += `<p class="text-left" style="margin-top: 0; margin-bottom: 15px;">${page.to}</p>`;
                }

                html += `<p class="text-left" style="margin-top: 0; margin-bottom: 15px;">${page.content}</p>`;

                if (page.signoff) {
                    html += `<p class="text-left" style="margin-top: 15px; margin-bottom: 0;">${page.signoff}</p>`;
                }
                return html;
            }
        }

        function openEnvelope(event) {
            event.stopPropagation();
            document.getElementById("envelope").classList.add("open");

            setTimeout(() => {
                document.getElementById("book").classList.add("active");
                currentLeafIndex = 0;
                isBookOpen = true;
                updateHoverTargets();
            }, 300);
        }

        function handlePageClick(event, leafIndex, sideClicked) {
            event.stopPropagation();

            if (sideClicked === 'front') {
                const targetLeaf = document.getElementById(`leaf-${leafIndex}`);
                if (targetLeaf) {
                    targetLeaf.classList.add("flipped");
                    targetLeaf.style.zIndex = leafIndex + 1;
                    currentLeafIndex = leafIndex + 1;
                }
            } else if (sideClicked === 'back') {
                if (leafIndex === leafCount - 1) {
                    resetPagesToFront();
                    return;
                }

                const targetLeaf = document.getElementById(`leaf-${leafIndex}`);
                if (targetLeaf) {
                    targetLeaf.classList.remove("flipped");
                    targetLeaf.style.zIndex = leafCount - leafIndex;
                    currentLeafIndex = leafIndex;
                }
            }
            updateHoverTargets();
        }

        function resetPagesToFront() {
            for (let i = leafCount - 1; i >= 0; i--) {
                const leaf = document.getElementById(`leaf-${i}`);
                if (leaf) {
                    leaf.classList.remove("flipped");
                    leaf.style.zIndex = leafCount - i;
                }
            }
            currentLeafIndex = 0;
            updateHoverTargets();
        }

        function updateHoverTargets() {
            for (let i = 0; i < leafCount; i++) {
                const leaf = document.getElementById(`leaf-${i}`);
                if (!leaf) continue;

                leaf.classList.remove("next-turn-target", "back-turn-target");

                if (i === currentLeafIndex) {
                    leaf.classList.add("next-turn-target");
                }
                if (i === currentLeafIndex - 1) {
                    leaf.classList.add("back-turn-target");
                }
            }
        }

        function closeBook() {
            if (!isBookOpen) return;

            resetPagesToFront();
            isBookOpen = false;

            setTimeout(() => {
                document.getElementById("book").classList.remove("active");
                document.getElementById("envelope").classList.remove("open");
            }, 400);
        }

        document.addEventListener('click', function () {
            closeBook();
        });

        initApp();
    </script>

</body>

</html>
